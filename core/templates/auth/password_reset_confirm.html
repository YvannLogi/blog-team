{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-md px-6 py-16">

    <header class="mb-10">
        <p class="text-xs uppercase tracking-widest text-gray-400">Account</p>
        <h1 class="mt-2 text-4xl font-semibold tracking-tight">New password</h1>
    </header>

    {% if validlink %}
    <form method="post" novalidate class="space-y-6">
        {% csrf_token %}
        {% include "auth/_form_fields.html" %}

        <div class="flex items-center justify-end border-t border-gray-100 pt-8">
            <button type="submit" class="rounded-full bg-black px-6 py-2 text-sm text-white hover:bg-gray-800 transition-colors">
                Set password
            </button>
        </div>
    </form>
    {% else %}
    <p class="border-l-2 border-red-300 pl-4 text-sm text-gray-500">
        This reset link is invalid or has already been used. Please request a new one.
    </p>
    <div class="mt-10">
        <a href="{% url 'core:password_reset' %}" class="rounded-full bg-black px-5 py-2 text-sm text-white hover:bg-gray-800 transition-colors">
            Request a new link
        </a>
    </div>
    {% endif %}

</section>
{% endblock %}
