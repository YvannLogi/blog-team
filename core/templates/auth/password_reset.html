{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-md px-6 py-16">

    <header class="mb-10">
        <p class="text-xs uppercase tracking-widest text-gray-400">Account</p>
        <h1 class="mt-2 text-4xl font-semibold tracking-tight">Reset password</h1>
        <p class="mt-4 text-sm text-gray-500">
            Enter the email linked to your account and we'll send you a link to choose a new password.
        </p>
    </header>

    <form method="post" novalidate class="space-y-6">
        {% csrf_token %}
        {% include "auth/_form_fields.html" %}

        <div class="flex items-center justify-between border-t border-gray-100 pt-8">
            <a href="{% url 'core:login' %}" class="text-sm text-gray-500 hover:text-black transition-colors">
                Back to log in
            </a>
            <button type="submit" class="rounded-full bg-black px-6 py-2 text-sm text-white hover:bg-gray-800 transition-colors">
                Send link
            </button>
        </div>
    </form>

</section>
{% endblock %}
