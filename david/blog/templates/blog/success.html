{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-xl px-6 py-24 text-center">

    <div class="mx-auto mb-8 flex h-12 w-12 items-center justify-center rounded-full border border-gray-200 text-lg text-gray-900">
        ✓
    </div>

    <p class="text-xs uppercase tracking-widest text-gray-400">Submitted</p>

    <h1 class="mt-2 text-3xl font-semibold tracking-tight">Thank you for your post</h1>

    <p class="mt-4 text-gray-500 leading-relaxed">
        {% if title %}“{{ title }}” has been received{% else %}Your post has been received{% endif %}
        and will be published once our team has reviewed it.
    </p>

    <div class="mt-10 flex items-center justify-center gap-6 text-sm">
        <a href="{% url 'blog:post-list' %}" class="text-gray-500 hover:text-black transition-colors">
            View all posts
        </a>
        <a href="{% url 'blog:create_post' %}" class="rounded-full bg-black px-5 py-2 text-white hover:bg-gray-800 transition-colors">
            Write another post
        </a>
    </div>

</section>
{% endblock %}
