{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-md px-6 py-16">

    <header class="mb-10">
        <p class="text-xs uppercase tracking-widest text-gray-400">Account</p>
        <h1 class="mt-2 text-4xl font-semibold tracking-tight">Log in</h1>
    </header>

    <form method="post" novalidate class="space-y-6">
        {% csrf_token %}
        {% include "auth/_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">

        <p class="text-right text-sm">
            <a href="{% url 'core:password_reset' %}" class="text-gray-500 hover:text-black transition-colors">
                Forgot your password?
            </a>
        </p>

        <div class="flex items-center justify-between border-t border-gray-100 pt-8">
            <a href="{% url 'core:register' %}" class="text-sm text-gray-500 hover:text-black transition-colors">
                No account? Register
            </a>
            <button type="submit" class="rounded-full bg-black px-6 py-2 text-sm text-white hover:bg-gray-800 transition-colors">
                Log in
            </button>
        </div>
    </form>

</section>
{% endblock %}
