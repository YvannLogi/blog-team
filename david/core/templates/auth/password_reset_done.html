{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-xl px-6 py-24 text-center">

    <div class="mx-auto mb-8 flex h-12 w-12 items-center justify-center rounded-full border border-gray-200 text-lg text-gray-900">
        ✉
    </div>

    <p class="text-xs uppercase tracking-widest text-gray-400">Account</p>

    <h1 class="mt-2 text-3xl font-semibold tracking-tight">Check your email</h1>

    <p class="mt-4 text-gray-500 leading-relaxed">
        If an account exists for that email, you'll receive a link to reset your password shortly.
    </p>

    <div class="mt-10 flex items-center justify-center gap-6 text-sm">
        <a href="{% url 'core:login' %}" class="rounded-full bg-black px-5 py-2 text-white hover:bg-gray-800 transition-colors">
            Back to log in
        </a>
    </div>

</section>
{% endblock %}
