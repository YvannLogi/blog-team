{% extends "master.html" %}

{% block content %}
<section class="mx-auto max-w-2xl px-6 py-16">

    <header class="mb-10">
        <p class="text-xs uppercase tracking-widest text-gray-400">Comment</p>
        <h1 class="mt-2 text-4xl font-semibold tracking-tight">Edit comment</h1>
        <p class="mt-4 text-sm text-gray-500">
            On the post “{{ comment.post.title }}”
        </p>
    </header>

    <form method="post" novalidate class="space-y-6">
        {% csrf_token %}
        {{ form.content }}

        {% if form.content.errors %}
        <p class="text-sm text-red-600">{{ form.content.errors|join:", " }}</p>
        {% endif %}

        <div class="flex items-center justify-between border-t border-gray-100 pt-8">
            <a href="{{ comment.post.get_absolute_url }}#comment-{{ comment.pk }}" class="text-sm text-gray-500 hover:text-black transition-colors">
                Cancel
            </a>
            <button type="submit" class="rounded-full bg-black px-6 py-2 text-sm text-white hover:bg-gray-800 transition-colors">
                Save
            </button>
        </div>
    </form>

</section>
{% endblock %}
